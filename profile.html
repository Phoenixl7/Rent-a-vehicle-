<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<header class="navbar"><div class="container nav-content"><a class="logo" href="index.html">RentAVehicle</a><div id="sessionArea"></div></div></header>
<main class="container section"><div class="card" style="max-width:640px;"><h2>Profile Page</h2><p>Verification: <span id="profileVerification"></span></p><form id="profileForm"><label>Name</label><input id="profileName" required><label>Email</label><input id="profileEmail" disabled><label>Phone</label><input id="profilePhone"><button class="btn btn-primary" type="submit">Update Profile</button></form><div id="profileBanner" class="banner">Profile updated successfully.</div><hr style="border-color:rgba(255,255,255,0.15);margin:20px 0;"><h3>Change Password</h3><form id="passwordForm"><label>Current Password</label><input id="currentPassword" type="password" required><label>New Password</label><input id="newPassword" type="password" minlength="6" required><label>Confirm New Password</label><input id="confirmPassword" type="password" minlength="6" required><button class="btn btn-primary" type="submit">Update Password</button></form><div id="passwordBanner" class="banner">Password updated successfully.</div></div></main>
<script src="assets/app.js"></script></body></html>
