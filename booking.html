<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Booking</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<header class="navbar"><div class="container nav-content"><a class="logo" href="index.html">RentAVehicle</a><div id="sessionArea"></div></div></header>
<main class="container section"><div class="card" style="max-width:640px;"><h2>Booking Page</h2><p id="bookingVehicle"></p><form id="bookingForm"><label>Start Date</label><input id="startDate" type="date" required><label>End Date</label><input id="endDate" type="date" required><label>Address Line 1</label><input id="addressLine1" placeholder="House/Street" required><label>Address Line 2</label><input id="addressLine2" placeholder="Area/Landmark" required><label>City</label><input id="deliveryCity" placeholder="Enter city" required><label>State</label><input id="deliveryState" placeholder="Enter state" required><label>Pin code</label><input id="deliveryPincode" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit pin code" required><button class="btn btn-primary" type="submit">Continue to Payment</button></form></div></main>
<script src="assets/app.js"></script></body></html>
